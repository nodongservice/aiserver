name: Aiserver CI/CD

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: aiserver_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aiserver_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/aiserver_test
      CORS_ALLOW_ORIGINS: http://localhost:3000
      EXPLANATION_PROVIDER: rule_fallback
      OPENAI_API_KEY: test-key
      LOG_LEVEL: INFO
      AUTO_CREATE_DB_SCHEMA: "true"
      REQUIRE_POSTGIS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -q

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    concurrency:
      group: aiserver-prod-deploy
      cancel-in-progress: false

    env:
      IMAGE_PLATFORMS: linux/amd64,linux/arm64
      REMOTE_APP_ROOT: ~/bridgework/aiserver

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image URI
        id: image
        run: |
          owner_lc="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_uri="ghcr.io/${owner_lc}/bridgework-aiserver:${GITHUB_SHA}"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "Resolved image URI: $image_uri"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.image.outputs.image_uri }}

      - name: Verify OCR runtime dependencies in image (amd64)
        run: |
          docker pull --platform linux/amd64 "$IMAGE_URI"
          docker run --rm --platform linux/amd64 --entrypoint /app/.venv/bin/python "$IMAGE_URI" - <<'PY'
          from app.services.profile_portfolio_draft_service import verify_profile_draft_ocr_runtime_dependencies

          verify_profile_draft_ocr_runtime_dependencies()
          print("OCR runtime dependency verification passed (amd64)")
          PY

      - name: Verify OCR runtime dependencies in image (arm64)
        run: |
          docker pull --platform linux/arm64 "$IMAGE_URI"
          docker run --rm --platform linux/arm64 --entrypoint /app/.venv/bin/python "$IMAGE_URI" - <<'PY'
          from app.services.profile_portfolio_draft_service import verify_profile_draft_ocr_runtime_dependencies

          verify_profile_draft_ocr_runtime_dependencies()
          print("OCR runtime dependency verification passed (arm64)")
          PY

      - name: Generate production env file
        env:
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROD_CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          PROD_EXPLANATION_PROVIDER: ${{ secrets.EXPLANATION_PROVIDER }}
          PROD_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          PROD_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PROD_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          PROD_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROD_OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          PROD_OPENAI_TIMEOUT_SECONDS: ${{ secrets.OPENAI_TIMEOUT_SECONDS }}
          PROD_LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          PROD_AUTO_CREATE_DB_SCHEMA: ${{ secrets.AUTO_CREATE_DB_SCHEMA }}
          PROD_REQUIRE_POSTGIS: ${{ secrets.REQUIRE_POSTGIS }}
          PROD_REQUIRE_PROFILE_DRAFT_OCR_DEPENDENCIES: ${{ secrets.REQUIRE_PROFILE_DRAFT_OCR_DEPENDENCIES }}
        run: |
          if [ -n "$PROD_EXPLANATION_PROVIDER" ]; then
            RESOLVED_EXPLANATION_PROVIDER="$PROD_EXPLANATION_PROVIDER"
          elif [ -n "$PROD_OPENAI_API_KEY" ]; then
            RESOLVED_EXPLANATION_PROVIDER="openai"
          else
            RESOLVED_EXPLANATION_PROVIDER="rule_fallback"
          fi

          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          database_url = os.environ.get("PROD_DATABASE_URL", "").strip()
          if not database_url:
              print("DATABASE_URL secret is empty.")
              sys.exit(1)
          if "\n" in database_url or "\r" in database_url:
              print("DATABASE_URL secret must be a single line.")
              sys.exit(1)

          parsed = urlsplit(database_url)
          if parsed.scheme not in {"postgresql", "postgresql+psycopg2"} or not parsed.netloc:
              print("DATABASE_URL secret must look like postgresql+psycopg2://user:password@host:5432/dbname.")
              sys.exit(1)
          PY

          {
            echo "DATABASE_URL=${PROD_DATABASE_URL}"
            echo "CORS_ALLOW_ORIGINS=${PROD_CORS_ALLOW_ORIGINS:-}"
            echo "EXPLANATION_PROVIDER=${RESOLVED_EXPLANATION_PROVIDER}"
            echo "LLM_BASE_URL=${PROD_LLM_BASE_URL:-}"
            echo "LLM_API_KEY=${PROD_LLM_API_KEY:-}"
            echo "OPENAI_BASE_URL=${PROD_OPENAI_BASE_URL:-https://api.openai.com/v1}"
            echo "OPENAI_API_KEY=${PROD_OPENAI_API_KEY:-}"
            echo "OPENAI_MODEL=${PROD_OPENAI_MODEL:-gpt-5.4-nano}"
            echo "OPENAI_TIMEOUT_SECONDS=${PROD_OPENAI_TIMEOUT_SECONDS:-8}"
            echo "LOG_LEVEL=${PROD_LOG_LEVEL:-INFO}"
            echo "AUTO_CREATE_DB_SCHEMA=${PROD_AUTO_CREATE_DB_SCHEMA:-false}"
            echo "REQUIRE_POSTGIS=${PROD_REQUIRE_POSTGIS:-true}"
            echo "REQUIRE_PROFILE_DRAFT_OCR_DEPENDENCIES=${PROD_REQUIRE_PROFILE_DRAFT_OCR_DEPENDENCIES:-true}"
          } > .env.cicd.prod

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          EC2_HOST_TRIMMED="$(printf '%s' "$EC2_HOST" | tr -d '\r\n[:space:]')"
          EC2_PORT_TRIMMED="$(printf '%s' "${EC2_PORT:-22}" | tr -d '\r\n[:space:]')"

          if [ -z "$EC2_HOST_TRIMMED" ]; then
            echo "EC2_HOST is empty after trimming whitespace."
            exit 1
          fi

          if ! [[ "$EC2_PORT_TRIMMED" =~ ^[0-9]+$ ]]; then
            echo "EC2_PORT must be numeric."
            exit 1
          fi

          {
            echo "EC2_HOST_TRIMMED=$EC2_HOST_TRIMMED"
            echo "EC2_PORT_TRIMMED=$EC2_PORT_TRIMMED"
          } >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          export EC2_HOST_TRIMMED EC2_PORT_TRIMMED
          python - <<'PY'
          import os
          import socket
          import sys

          host = os.environ["EC2_HOST_TRIMMED"]
          port = int(os.environ["EC2_PORT_TRIMMED"])

          print("Resolving configured EC2 host...")
          try:
              socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
          except OSError as exc:
              print(f"DNS resolution failed: {exc.__class__.__name__}: {exc}")
              sys.exit(1)
          print("DNS resolution ok")

          print("Checking TCP reachability to configured SSH port...")
          try:
              with socket.create_connection((host, port), timeout=10):
                  pass
          except OSError as exc:
              print(f"TCP connection failed: {exc.__class__.__name__}: {exc}")
              sys.exit(1)
          print("TCP connection ok")
          PY

          echo "Scanning SSH host key for configured EC2 host."
          ssh-keyscan -T 10 -p "$EC2_PORT_TRIMMED" "$EC2_HOST_TRIMMED" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 \
            -p "$EC2_PORT_TRIMMED" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST_TRIMMED" \
            "echo ssh-ok"

      - name: Prepare remote directories
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -p "$EC2_PORT_TRIMMED" "$EC2_USER@$EC2_HOST_TRIMMED" \
            "mkdir -p $REMOTE_APP_ROOT/deploy $REMOTE_APP_ROOT/state"

      - name: Upload deploy assets
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -P "$EC2_PORT_TRIMMED" .env.cicd.prod "$EC2_USER@$EC2_HOST_TRIMMED:$REMOTE_APP_ROOT/.env.prod"
          scp -P "$EC2_PORT_TRIMMED" deploy/deploy.sh "$EC2_USER@$EC2_HOST_TRIMMED:$REMOTE_APP_ROOT/deploy/deploy.sh"

      - name: Deploy on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh -p "$EC2_PORT_TRIMMED" "$EC2_USER@$EC2_HOST_TRIMMED" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

          ssh -p "$EC2_PORT_TRIMMED" "$EC2_USER@$EC2_HOST_TRIMMED" "
            chmod +x $REMOTE_APP_ROOT/deploy/deploy.sh && \
            IMAGE_URI=$IMAGE_URI PULL_IMAGE=true ENV_FILE=$REMOTE_APP_ROOT/.env.prod UPSTREAM_SWITCH_SCRIPT=\$HOME/bridgework-infra/deploy/fastapi_blue_green_switch.sh bash $REMOTE_APP_ROOT/deploy/deploy.sh
          "
